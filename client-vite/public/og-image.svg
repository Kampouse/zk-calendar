<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="em" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow accent -->
  <ellipse cx="600" cy="280" rx="350" ry="180" fill="#10b981" opacity="0.07" filter="url(#glow)"/>

  <!-- Lock icon -->
  <rect x="555" y="120" width="90" height="70" rx="12" fill="none" stroke="#10b981" stroke-width="3"/>
  <path d="M575 120 V95 a25 25 0 0 1 50 0 v25" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <circle cx="600" cy="152" r="8" fill="#10b981"/>
  <rect x="596" y="152" width="8" height="16" rx="2" fill="#10b981"/>

  <!-- Title -->
  <text x="600" y="260" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="56" fill="white">ZK Calendar</text>

  <!-- Tagline -->
  <text x="600" y="310" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-weight="400" font-size="24" fill="#94a3b8">Private Group Scheduling</text>

  <!-- Divider -->
  <line x1="440" y1="340" x2="760" y2="340" stroke="#10b981" stroke-width="1" opacity="0.3"/>

  <!-- Features -->
  <text x="600" y="385" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="18" fill="#34d399">🔒 Event titles never leave your device</text>
  <text x="600" y="415" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="18" fill="#34d399">✓ Only free/busy state is proven</text>
  <text x="600" y="445" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="18" fill="#34d399">✓ Groups see counts, not identities</text>

  <!-- URL -->
  <text x="600" y="520" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="400" font-size="16" fill="#475569">zk-calendar.pages.dev</text>

  <!-- Bottom accent line -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#em)" opacity="0.6"/>
</svg>