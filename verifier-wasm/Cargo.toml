[package]
name = "zk-calendar-tee"
version = "0.4.0"
edition = "2021"
description = "ZK Calendar TEE worker — stores Google credentials encrypted, fetches calendar, generates availability proofs"

[[bin]]
name = "zk-calendar-tee"
path = "src/main.rs"

[dependencies]
outlayer = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasi-http-client = "0.2"
base64 = "0.22"

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
strip = true
debug = false
panic = "abort"
overflow-checks = false