[package]
name = "zk-calendar-tee"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "zk-calendar-tee"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
debug = false
panic = "abort"
overflow-checks = false
